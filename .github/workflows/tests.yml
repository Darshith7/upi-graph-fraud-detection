name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only PyTorch first (the default Linux wheel pulls ~2 GB of CUDA libraries)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Fast test suite (21 tests)
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        run: python tests/test_system_components.py
      - name: Dashboard smoke test (headless Chromium)
        env:
          PYTHONUTF8: "1"
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          python tests/test_dashboard_e2e.py
